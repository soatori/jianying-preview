    // 负样本 model-blacktest.json 的 black_streaks 被抹成 []，判据自己把自己弄瞎了。
    // 视频轨上放 mp3 时"这一段没有画面"是用户看得见的空白，属于要报的事实，不属于要豁免的噪声；
    // noVideoPaths 的作用只限于"别再逐帧重开一次流、别把同一件事刷成 12 条错误"。
    const node = sprites.get(s.id);
    if (node && node.visible) { missStreak.delete(s.id); continue; }
    const n = (missStreak.get(s.id) || 0) + 1;
    missStreak.set(s.id, n);
    if (n >= BLACK_STREAK) {
      blacked.push(s.id.slice(0, 8)); blackSeen.add(s.id.slice(0, 8));
      // 只记 id 就永远只能猜。带上"这次空窗发生在段内第几毫秒 + 它的泵此刻是什么状态"，
      // 才分得清两件事：**切点起步的那一帧没赶上**（age 小、泵刚建/队列空）
      // 还是**播到一半断供**（age 大、队列被抽干）。前一种是预热/预解码的深度问题，
      // 后一种是交付/驱逐问题——修法完全不同（P-92 就是因为只有 id 而定不了责）。
      if (n === BLACK_STREAK && blackDetail.length < 40) {
        const p = pumps.get(s.id);
        blackDetail.push({ id: s.id.slice(0, 8), pos: +(posUs / 1e6).toFixed(2),
          age_ms: Math.round(posUs - s.target.start_us),
          pump: p ? (p.error ? 'err' : p.done ? 'done' : `q${p.q.length}`) : 'none',
          warm: p?.warm ? 1 : 0, sprite: sprites.has(s.id) ? 1 : 0,
          hold: HOLD_ON ? 1 : 0, priv_live: privLive });
      }
    }
  }
  // Cumulative, not a snapshot: the playhead moves on, and a report taken after a seek storm
  // would otherwise read empty for a layer that was blank for seconds (the fixture run proved it).
  stat.blackStreaks = [...blackSeen];
  stat.blackDetail = blackDetail;
  if (blacked.length) {
    badge.visible = true;
    badge.text = `\u26a0 \u8fde\u7eed ${BLACK_STREAK} \u5e27\u6ca1\u51fa\u56fe\uff1a${blacked.join(' ')}`;
  }
}

async function loadFonts() {
  // The draft records the absolute path of the face it used; serving it through the same
  // id-addressed read-only route means the preview rasterises the same glyphs (F-036).
  for (const f of model.fonts || []) {
    const id = idOf.get(f.path);
    if (!f.exists || !id) continue;
    const fam = 'JY-' + (f.path.split('/').pop() || 'font').replace(/\.[^.]+$/, '') + '-' + id.slice(0, 6);
    try {
      const face = new FontFace(fam, `url(/media/${id})`);
      await face.load();
      document.fonts.add(face);
      fontFamilies.set(f.path, fam);
    } catch (e) {
      out(`  ! font ${String(e && e.message || e).slice(0, 70)}`);
    }
  }
  out(`字体：${fontFamilies.size}/${(model.fonts || []).length} 已注册`);
}

const hud = (id, v) => { document.getElementById(id).textContent = v; };
let frameNo = 0;
const tickErrors = [];
const AVCLK_ON = Q.get('avclk') === '1';   // 默认仍走墙钟：实测两臂残差都是 −0.008 s（最大 +0.02 s），
                                           // 换时钟**没有**改善音画对齐——停顿的效应是画面"跳一下"，
                                           // 不是"落后于音频"（`pos += dt` 会把挡住的时间一次补回来）。
                                           // 保留 &avclk=1 只是把这条否证留在仪器里，别下次又凭猜想改。
let actxT0 = 0;
let pos = 0, playing = false, measuring = false, lastWall = 0, frames = 0, winStart = 0, intervals = [], lastAt = 0, framesDecoded = 0, lastFiles = [];

async function tick(t) {
  if (measuring) { requestAnimationFrame(tick); return; }
  let gapMs = -1, gapPos = 0;
  if (playing) {
    scheduleAudio(pos);
    // 播放头跟随**音频时钟**，不再跟墙钟。这个文件的第 150 行早就写着
    // "AudioContext is the clock authority"，但 tick() 一直用 performance.now() 推进——
    // 于是每次 `await paint()` 超预算（实测整条时间轴累计 942 ms、21 帧过线），
    // 画面冻住而音频照播 ⇒ 音频一路领先画面，听起来就是"轨道没混合、有的该响没响"。
    // 视频跟音频是播放器的标准做法：超预算时宁可少画一帧，也不让两条时钟分叉。
    const clk = (AVCLK_ON && actx) ? (actx.currentTime - actxT0) * 1000 : t;
    if (lastWall) {
      const dt = (clk - lastWall) / 1000;
      pos = Math.min(DUR, pos + Math.max(0, dt));
      if (pos >= DUR) toggle(false);
    }
    lastWall = clk;
    if (!winStart) winStart = t;
    if (lastAt) { gapMs = Math.round(t - lastAt); gapPos = +pos.toFixed(2); }
    lastAt = t; frames++;
  }
  const paintT0 = now();
  try { await paint(pos * 1e6); }
  catch (e) { tickErrors.push(String(e && e.message || e).slice(0, 120)); }
  // 当帧 paint 耗时和帧间隔一起记：gap≈paint 是我们画得慢，gap≫paint 是浏览器没给帧。
  if (gapMs >= 0) intervals.push([gapMs, gapPos, Math.round(now() - paintT0)]);
  hud('pos', `${pos.toFixed(2)} / ${DUR.toFixed(2)} s`);
  hud('stat', `req ${stat.requests} / bytes ${(stat.bytes / 1e6).toFixed(1)} MB`);
  hud('heap', performance.memory ? `heap ${(performance.memory.usedJSHeapSize / 1048576).toFixed(0)} MB` : 'heap -');
  const el = (t - winStart) / 1000;
  if (playing && el > 0.5) hud('fps', `fps ${(frames / el).toFixed(2)} 池 ${pool.map.size}`);
  document.getElementById('play').style.left = `${(pos / DUR) * 100}%`;
  requestAnimationFrame(tick);
}

function toggle(on) {
  playing = on ?? !playing;
  if (playing) {
    ensureAudio();
    actxT0 = (AVCLK_ON && actx) ? actx.currentTime : 0;   // 播放起点绑定到音频时钟
    winStart = 0; frames = 0; lastWall = 0; lastAt = 0;
  }
  else { killPumps(); stopAudio(); }
  hud('mode', `mode ${playing ? 'PLAY' : 'PAUSE'}`);
}

const bar = document.getElementById('bar');
for (const track of [...videoTracks, ...textTracks]) {
  for (const s of track.segments) {

  toggle(true);
  // 本机三次独立实测（headless、Qoder 内置浏览器、我自己起的带头 Chrome）都是 rAF **0 帧**，
  // 所以真实帧节奏在自动判据里量不到。但 tick() 本来就是 rAF 不等它返回的 fire-and-forget：
  // 用定时器按同一帧率去敲同一个函数体，`await paint()` 挡住下一拍的效应完全一样，
  // 于是"画面推进 vs 音频时钟"的残差就自动可测。用 &drive=timer 显式声明，不冒充真实 rAF。
  let pump = null;
  if (Q.get('drive') === 'timer') {
    pump = setInterval(() => {
      try { tick(now()); } catch (e) { tickErrors.push(String((e && e.message) || e)); }
    }, Math.round(1000 / (+(Q.get('fps') || 30))));
  }
  await new Promise((res) => setTimeout(res, ms));
  if (pump) clearInterval(pump);
  toggle(false);
  clearInterval(sampler);
  const pct = (xs, p) => (xs.length ? xs[Math.min(xs.length - 1, Math.round(p * (xs.length - 1)))] : null);
  const gaps = intervals.map((x) => x[0]).sort((a, b) => a - b);
  const paints = intervals.map((x) => x[2]).sort((a, b) => a - b);
  const r = { tag: Q.get('tag') || 'playback', model_url: MODEL_URL.split('/').pop(),
    canvas: `${W}x${H}`, visibility: document.visibilityState, raf: frames > 0,
    live: { window_ms: ms, frames: intervals.length,
      gap_p50_ms: pct(gaps, 0.5), gap_p90_ms: pct(gaps, 0.9), gap_p95_ms: pct(gaps, 0.95),
      gap_max_ms: gaps.length ? gaps[gaps.length - 1] : 0,
      gaps_over_50ms: gaps.filter((g) => g > 50).length,
      gaps_over_100ms: gaps.filter((g) => g > 100).length,
      gaps_over_200ms: gaps.filter((g) => g > 200).length,
      paint_p50_ms: pct(paints, 0.5), paint_p95_ms: pct(paints, 0.95),
      paint_max_ms: paints.length ? paints[paints.length - 1] : 0,
      worst_gap_ms: gaps.length ? gaps[gaps.length - 1] : 0,
      // [gap_ms, 播放头 s, 当帧 paint ms]：位置用来把卡顿对到切点/段头，paint 用来分责任
      worst: [...intervals].sort((a, b) => b[0] - a[0]).slice(0, 10),
      clock_track: clockTrack.slice(0, 400), driver: Q.get('drive') || 'raf',
      // 预热带在真实帧节奏里是否真跑起来了：started=建了几个预热泵、used=有几个被到点的第一帧
      // 真取走、wasted=白热了几个。没有这三个数，"gap 变小"可能只是别的改动带来的。
      warm: { ...warmStats, on: WARM_ON, lead_s: VIDEO_LEAD, max: WARM_MAX },
      avclk: AVCLK_ON },
    black_streaks: stat.blackStreaks || [], tick_errors: [...new Set(tickErrors)].slice(0, 6) };
  r.capture = await postCapture('live-' + (Q.get('tag') || 'liveplay'));
  // 同 battery()：页内戳换成 epoch 毫秒用的基准（S2 的窗相交）。
  r.epoch_base = Math.round(Date.now() - now());
  r.epoch_sent = Date.now();
  r.slow_legs = { gaps: slowLegs.gaps, over: slowLegs.over, dropped: slowLegs.dropped,
                  threshold_ms: SLOW_LEG_MS, rows: slowLegs.rows };
  r.switches = { split: SPLIT_ON, qmax: QMAX, warm: WARM_ON, warm_lead_s: VIDEO_LEAD,
                 probe: [...PROBE_IDS], search: location.search };
  await fetch('/report', { method: 'POST', body: JSON.stringify(r) });
  out('LIVEPLAY ' + JSON.stringify(r.live));
  document.title = 'DONE';
}
</script>
