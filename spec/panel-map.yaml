# 剪映属性面板 ↔ 草稿字段映射
# 来源：用户提供的 20 张面板截图（画面/音频/变速/动画/调整 四个 tab 逐控件）对照 2,215 份内容文件（2,050 份去重内容，r3 快照 2026-10-16）的实测键名
# **本文件里的 count 一律标口径**：写「（r3）」的是去重内容口径；没标的多为当时的 700 份抽样或 r1 翻倍口径，正由 `temp/check_counts.py` 逐行清理（见 findings F-020）
# **文本 tab 的控件映射见下方 `文本.基础` / `文本.位置` / `文本.背景发光阴影` / `文本.动画`**（按用户 2026-10-16 的 6 张面板截图逐控件录入）；
# 文本字段的语义、取值域与换算细节仍在 spec/text.yaml -> ui_panel_mapping，两处冲突时以本文件的控件归属为准、以 text.yaml 的字段细节为准
# 置信：verified=字段与控件语义双向对上（键名+取值枚举互证）；likely=按 bucket 用途与键名推断，需确认；open=未定位
# 确认方法（按便宜程度排序）：① 拿面板截图上的 UI 数值去语料反查（见 evidence/findings.md 的位置单位标定）
#                          ② 同一草稿改一个控件 → 保存 → 对比全部副本解码后的 diff

