agent_declared_units:      # 2026-10-21 新增（F-049）：剪映自带 agent 的展示 schema 里成批写明的「面板值 ↔ 引擎值」量纲
  evidence_level: single（**一路**证据：`skills/jianying.hub.studio_lyra_xml_timeline_builder_v2/references/*`
    与 `skills/skill-creator/references/editing/*` 是同一份 schema 的两份生成物，后者只是中文显示名，
    两者不能互相当第二路；和语料/成片实测合起来才算 verified）
  caveat: >-
    这些是 **xmldraft/v1 的写作面量纲**，不是草稿 JSON 的存储量纲。XML 别名与 draft 键的映射在
    `videoeditor.dll` 里、本机读不到（F-047），所以下面凡标「对应草稿键」的都是按名称+值域+单位推的，
    实现时要按被测对象复核（U-65）
  conversions:
    - 原声音量 volume：面板 0..1000、默认 100，「100 保持原始音量、200 为两倍幅度、30% 写裸数 30」（segment-visual.md:253）
      → 草稿侧 segment.volume 官方模型层默认 **1** ⇒ 面板值 = 草稿值 × 100
    - 片段不透明度 alpha：0..1 裸数，「50% 写 value="0.5"，不写 50」（segment-visual.md:33）→ 与 `clip.alpha` 同量纲
    - 文字不透明度 text_alpha：0..1、默认 1（segment-text-sticker.md:79）；**阴影 alpha 却是百分制滑杆**「30% 写 30」（:131/:163）
      → 同一个「不透明度」词在三个位置三种量纲，别类推
    - 滤镜强度 filter.intensity：0..100 面板百分值，「70% 写 70，不写 0.7 或 70%」（segment-visual.md:131）；
      特效**没有**通用整体强度，只能写 `slider_params` 里资源声明的 key（segment-effects.md:22）
    - 画布背景模糊 canvas.blur：0..1 裸数，四档 0.0625 / 0.375 / 0.75 / 1，未指定时运行时默认 **0.75**（segment-visual.md:76）
      → 对应 `canvases[].type=canvas_blur`（1,620 条，F-048）；这是 4 档离散值，不是连续滑杆
    - 描边（抠像描边）：size/alpha/distance/shadow/texture 全 0..100 面板滑杆，size 缺省 **35**（segment-visual.md:167/:190）
      → 映射 `effects_adjust_{size,distance,texture}`；与 F-027 的「视频描边 UI ÷ 100」同族但量纲不同（那边是 0..1）
    - 抠像 feather / expand：**双量纲**，普通视频图片 feather 0..100、expand -20..20；模板媒体槽两者都 0..1000（segment-visual.md:168）
    - 蒙版 feather：0..1，官方分档 0..0.05 近硬边 / 0.06..0.12 常规 / 0.13..0.2 明显 / 0.21..0.3 强融合，
      并明确「禁止套用 matting 的 0..100 或 0..1000 量纲」（segment-visual.md:143/:152）
    - 阴影模糊：面板 → 引擎 **÷ 600**（0..100 → 0..1/6），实测印证见 U-03 结案（F-049）
    - 字间距 / 行间距：面板滑杆裸数，「用户说 10 就写 10，不折算成 0.1 或像素」（segment-text-sticker.md:122/:123）
      → 注意官方模型层的 flat 默认是 `letter_spacing=0`、`line_spacing=0.2`，**0.2 是引擎侧不是面板侧**，两层不同量纲
    - 字号 size：**剪映字号数值**，明说「不是像素或画布百分比」「size=160 不能当 160 像素」（segment-text-sticker.md:66/:77）
      → 与 U-07 的 `em_px = size × width × 0.00574` 不冲突：size 是无单位面板数，em 才是像素
    - 倍速 speed：「写 1.25 表示 1.25 倍，不写 125」（timeline.md:108）；text/subtitle/sticker **禁止**写 time.speed
    - 旋转 rotation：**顺时针为正、逆时针为负**，角度裸数（transform.md:89）；蒙版 rotation 同向（segment-visual.md:156）
    - 时间：协议一律裸毫秒，`us/ms/s/min/m` 后缀非法（timeline.md:92）→ 草稿 JSON 是微秒，两层 **×1000**
    - 位置归一化的**第三条**见证是代码不是文档（F-052）：贴纸/文字模板读回包围盒后执行 `x/2 + 0.5`（left/right/top/bottom 四个都这样）⇒ 归一化盒 `[-1,1]` 线性映射到 `[0,1]`，1 个单位 = 半画幅。与 F-035 导出实测、F-049 协议声明三处一致，`/2` 现在是源码级事实
