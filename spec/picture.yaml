# 画面（video/photo/adjust/effect/sticker）属性 → 渲染效果对照
# 实测范围：2050 份去重内容、51,718 个顶层 segment（r3，快照 2026-10-16）；来源 temp/corpus-scan/stats.json、temp/corpus-detail/*.csv（口径与漂移见 ../evidence/findings.md F-019/F-020）
# 等级：verified / single / open（详见 ../evidence/unresolved.md）

tracks:
  types_measured: {video: 3195, audio: 2582, text: 2439, mixed: 825, effect: 410, sticker: 277, adjust: 194, filter: 68}   # 按去重内容里出现的轨道条数计（r3；2026-10-20 全量重跑逐位复现，F-048）
  note: 轨道与 segment 都不带显式 z；层级由索引字段决定（见 compositing_order）
  segment_has_no_type: segment 自身没有 `type` 键（51,718 个片段全测），类型只由所属 `track.type` + `material_id` 指向的 bucket 决定
  track_type_material_map: >-
    `track.type` → `material_id` 实际落到的 bucket.type（r3 全量，按片段计；F-048）：
    video → `videos.{video 13,893 / photo 1,186 / image 2}`（**图片不是独立轨道类型，是 videos 里的 photo**）；
    audio → `audios.{sound 7,069 / video_original_sound 3,062 / music 1,302 / text_to_audio 1,143 / extract_music 166}`；
    text → `texts.{subtitle 17,016 / text 2,077 / lyrics 50}` + `text_templates.{text_template 804 / _subtitle 30 / _lyrics 1}`；
    sticker → `stickers.sticker 377` + `shapes.shape 21`；effect → `video_effects.{video_effect 466 / face_effect 79}`；
    filter → `effects.filter 111`；adjust → `placeholders.adjust 473`；
    **mixed → 同时指 video/photo/text/subtitle/lyrics/text_template/video_effect/placeholder 多类**（videos.video 1,511、
    texts.subtitle 564、texts.text 233、videos.photo 44、video_effects 26、placeholders 10、text_templates 1）
    ⇒ `mixed` 是「混合内容轨」，不是某一种素材类型，不能按类型分派渲染分支

clip:
  location: segment.clip                                  # 42,135 个 segment 带 clip 键（segment 总数 51,718；另有 4,325 条 clip 整值为 null）。旧行写 42,215 / 51,784 是错的，2026-10-20 按全量重跑更正（F-048）
  fields_measured:
    transform: 37890
    flip: 37890
    scale: 32855
    rotation: 13505
    alpha: 12586
  shape:
    transform: {x: float, y: float}                       # verified：子键恒为 x,y，**无 z**
    scale: {x: float, y: float}
    flip: {horizontal: bool, vertical: bool}
    rotation: float
    alpha: float
  absent_defaults:                                        # 字段缺失时的取值（open：需成片确认）
    transform: {x: 0, y: 0}
    scale: {x: 1, y: 1}
    rotation: 0
    alpha: 1
    flip: {horizontal: false, vertical: false}
  uniform_scale_note: 该字段在 segment 上，不在 clip 内    # verified（与 capcut-cli 文档冲突，见 conflicts C-002）

coordinates:
  law: >-
    渲染：offset_px = (transform.x × width / 2, -transform.y × height / 2)，原点在画布中心、
    **y 轴向上为正（负值向下）**、锚点=字框中心（F-035 导出实测）。
    面板：显示值 = transform.x × width、transform.y × height —— **是真实位移的 2 倍**（U-51）。
    第二画幅复核：同一条时间线原地 9:16→16:9 后，实测偏移 +238.0/+88.5 对预测 +239.1/+88.9（≤1.1px），
    「× 边长」假说被 2 倍否掉
  canvas_scope: "**画幅是 per-timeline 的**：同一草稿四条时间线可以两种比例并存（实测 9:16 与 16:9 各两条），根镜像只反映 `main_timeline_id` 那一条 → 渲染/写回必须按目标时间线取 `canvas_config`"
  disproved: 无 —— 参考文档的「半画幅归一 + y 轴向上」**是对的**，F-032 一度推翻它，是我把面板单位当成了画布像素（F-035 已改判）
  precision: 命中整数的那批偏差约 1e-15（double 精确），**不经 float32**；位置与阴影距离那类 float32 抖动是两回事
  ratio_trap: >-
    存值冻结在**写入当时**的画幅：1080x1440 草稿里 46.35% 的 y 只在 ×1920 时整数（×1440 仅 3.47%）。
    成对观测已钉死机制（F-033）：9:16 上键入的 `100/1080`、`-850/1920` 改画幅到 16:9 后**逐位不变**，
    面板只是乘上新边长再**就近取整**显示（177.7778→178、-478.125→-478）→ 面板整数是显示值不是存值；`.5` 一侧实测 `-637.5 → -638`（进位，非向零截断）
    （U-49 结案。**重键实验已做**：把 178 原样键回，剪映还原成 ≈177.7778/1920 而不是 178/1920 → 面板整数不是真值，未改过的 transform 要原样搬运；`.5` 舍入方向见 U-50）
  integer_share: text.y 52.09% @1080x1920 / 64.59% @1920x3414（同组按 1920 只 8.99%）；text.x 12.84%、video.y 10.69% → 水平位置多由 alignment 承载（F-031），画面侧多为自由浮点
  source: tables/position_quantum.csv（30 行，`build_evidence_tables.py -> position_quantum()`）

fit_and_canvas:
  root_field: canvas_config{width, height, ratio}
  ratio_values_measured: {"9:16": 867, original: 341, "3:4": 123, "16:9": 95, "1:1": 4, "4:3": 3}
  original_ratio: 含义为「按素材原始尺寸成画」，具体宽高来源未定            # open U-09
  draw_size: 绘制尺寸 = contain(素材 → 画布) × scale，且用未旋转包围盒比较    # single
  ratio_switch: 切换画幅是重算布局而非拉伸                                   # single
  per_segment_background:
    bucket: materials.canvases[]
    fields_measured: {id: 16492, type: 16492, blur: 5816, color: 4880, album_image: 4856, image: 4856, image_id: 4856, image_name: 4856, source_platform: 4856, team_id: 4856}

crop:
  location: materials.videos[].crop                        # 顶层 16,634 个 video material 全部带该键（`stats.json -> bucket_keys.videos.crop`）
  shape: {upper_left_x, upper_left_y, upper_right_x, upper_right_y, lower_left_x, lower_left_y, lower_right_x, lower_right_y}
  corner_counts: {upper_left_x: 4987, upper_left_y: 4992, upper_right_x: 5010, upper_right_y: 4992, lower_left_x: 4987, lower_left_y: 4991, lower_right_x: 5010, lower_right_y: 4991}
  related: [videos.crop_ratio(4995), videos.crop_scale(4950)]
  four_state: >-
    键存在 ≠ 有值 ≠ 非默认，这里是教科书案例（r3，`stats.json -> field_states.videos.crop`）：
    `{}` 空占位 **11,589** / 8 键 **4,955** / 4 键 68 / 2 键 21 / 6 键 1。
    而 4,955 个满形里 **4,875 恰好等于满框恒等** `upper_left(0,0) upper_right(1,0) lower_left(0,1) lower_right(1,1)`，
    **真裁剪只有 80 条**（`tables/video_crop_census.csv`，脚本 `scripts/field_census.py`）
  normalization: >-
    已判（F-049）：**源素材归一化 [0,1]、左上为原点、y 向下**，满框 = 上面那个恒等八元组。
    官方对同一坐标系的声明见 `…/references/segment-packages.md:24-25`
    「0 为左边，1 为右边，以**未裁剪、未变换**的源素材为基准」「0 为上边，1 为下边，左上角 (0,0)、右下角 (1,1)」。
    已测极值只是 80 条样本的**观测下界**，不是协议上限（`upper_*_y` 0..0.8685、`lower_*_y` 0.4563..1、
    `*_left_x` 0..0.6053、`*_right_x` 0.2342..1）
  semantics: 四角多边形（非 rect）；归一化已定，上限与成片裁剪结果仍待标定      # open U-10（已收窄）
  crop_ratio: >-
    是**字符串**枚举不是数：`free` 4,914 / 16:9 51 / 9:16 17 / 3:4 6 / 4:3 5 / 1:1 2；
    官方模型层默认逐字写 `crop_ratio="free"` ⇒ 两路一致。协议侧对应 `transform.crop`（比例串）
    + `crop_position`（8 个锚点枚举 left/top/right/bottom/left_top/right_top/left_bottom/right_bottom，省略=居中）
    + `crop_rotation`（度，默认 0）
  crop_scale: 4,949 / 4,950 恒为 1.0 ⇒ schema 占位，不承载缩放（别当缩放读）
  note: 旧行写 16,585 是 r2 遗留，r3 实为 16,634（2026-10-21 就地更正）；r1 的 13,828 是「每 bucket 只采样前 20 条」的下界

speed:
  location: segment.speed                                  # verified（19,603 个片段带，缺席 32,115）
  mirror: materials.speeds[].speed                         # 存在时**必然等于** segment.speed：11,680 / 11,680（r3 relations.csv）
  mirror_forms: 29,376 个 speeds 条目里 17,696 个不带 speed 键（这才是 stub）、8,293 个 =1、3,387 个带非 1 真实倍速；`speed != 1` 的片段全部有镜像
  relation: target_duration == source_duration / speed     # verified（10月16日 草稿复现：990000 / 0.9 = 1100000）
  note: 旧版「speeds 多为无值 stub、倍速只在 segment」的表述把「可以整键缺席」说成了「无值」，已改判见 conflicts C-011
  curve_speed: "变速曲线（`speeds[].mode` 实测 0:8810 / 1:298，`curve_speed` 存在 9,109 条）不在 phase-1"

derived_caches:                           # r3 逐片段 join 实测（temp/corpus-detail/relations.csv），M2 渲染与 M3 写回都依赖
  speeds_mirror: "materials.speeds[].speed == segment.speed，11,680 / 11,680 无例外；speed != 1 的片段全部有镜像"
  uniform_scale_value: "uniform_scale.value == clip.scale.x / clip.scale.y，12,465 命中 / 8 过期；{on:false} 的 35 条全部 x != y"
  uniform_scale_switch: >-
    勾选态用**缺席**表示 true：等比开=不写 `on`（或 `on:true`），等比关=写 `on:false`。
    `value` 只在等比开着时维护——2026-10-18 差分实测：关掉等比后 `{on:false}` 连 `value` 键都不写，
    再开回来则写 `{value: x/y}` 且**不改 `clip.scale`**（UI 单滑杆读写 x、y 留旧值，value 即恢复比例 y·value=x）。
    语料独立复核（含嵌套）：`on:false` 的 102 个各向异性样本 `value` 恒 1.0，`on` 缺席且各向异性的 16 例 `value==x/y`。
    渲染时用 x 覆盖两轴还是 (x, y·value) 判不了 → U-44
  keyframe_skeleton: >-
    同一份差分还暴露一条同步规则：片段可带 N 条**单帧关键帧骨架**轨道（每个可动画属性一条，
    `keyframe_list` 长度 1、无 `time_offset`、控制点 `(0,0)`）。改 `clip.scale.x` 时 `KFTypeScaleX` 的帧值同步变化，
    等比关闭时应用**新建** `KFTypeScaleY` 轨道、恢复等比时又**删除**它，而之后再把缩放拖到 200%（x、y 同乘）
    却没有重建 Y 轨道。所以「骨架恒在」不成立，且**只改标量字段不改骨架帧就会与剪映不一致** → U-45
  shadow_point: "|shadow_point| == 0.18 × shadow_distance，19,847 命中 / 963 过期 / 266 无可用距离；方向 == (cos,sin)(shadow_angle)，20,834 / 21 不符"
  rule: >-
    三者都是「源字段 + 派生缓存」。渲染层**只读源字段**（speed / clip.scale / shadow_distance+angle），
    写回时要么同步缓存、要么整键删除；`|point| == shadow_alpha` 那种吻合是 alpha 常等于 0.18×distance 的
    巧合别名，不是公式（见 ../evidence/findings.md F-023 与 write-rules.md §3 的三条同步不变式）。

segment_extra_fields:                     # r3 field_states 实测，规格此前零记录（../evidence/findings.md F-024）
  hdr_settings: "present 28,261：缺席 23,457 / null 11,879 / `{mode:1}` 10,980 / `{intensity,mode,nits}` 约 4,903（mode 另见过 2 一次）。HDR 输出参数，phase-1 不渲染但要原样读写"
  caption_info: "present 13,835，**全部为 null**（另缺席 37,883）→ 纯 schema 占位，解析器不要为它写分支"
  color_correct_alg_result: "6,011 条：字符串里套 JSON，键名带官方拼写错误 `*IntensityFisrt`；与 enable_color_correct_adjust / color_match / smart_color 同现，是 AI 调色结果缓存（调色按用户要求跳过，只需保真读写）"
  render_timerange: "present 40,934：`{}` 34,925 / 缺席 10,784 / **两键有值 6,009** —— 与 responsive_layout 不同，它真的有内容，不能一律当占位忽略（语义待 M2）"
  source: "present 34,567，标量；实测只见 `segmentsourcenormal` 一种取值，缺席 17,151"
  preserved_segment_keys: >-
    其余未逐条解释但必须原样保留的 segment 键（r3 出现次数，`stats.json -> segment_keys`）：
    `keyframe_refs` 16,792、`template_id` 17,699、`template_scene` 16,752、`track_attribute` 18,188、
    `is_placeholder` 16,689、`is_tone_modify` 17,194、`intensifies_audio` 16,689、`group_id` 16,691、
    `cartoon` 16,689、`reverse` 16,868、`visible` 18,621、`digital_human_template_group_id` 6,008、
    `is_loop`/`lyric_keyframes`/`raw_segment_id`/`state`/`desc` 各 6,178（音频/歌词族）、
    `segment_color_tag` 2、`hdr_vivid_settings` 2（与 hdr_settings 同族，语料里几乎没出现过）、
    `caption_info` 13,835（恒 null）、`color_correct_alg_result` 6,011。
    另有两个蒙版开关：`enable_mask_shadow` 8、`enable_mask_stroke` 12（分属 17 个片段），见 U-38。
    全集与逐条记录状态见 `coverage.md` 指向的台账 CSV。
  path_macro: "字符串值里可能出现 `##_draftpath_placeholder_<uuid>_##/…`（1,311 / 2,050 份内容、58,108 次），展开 = **草稿自身目录**；uuid 身份未知（U-41）。资源解析必须先展开，写回不得展开也不得改写 uuid"
  videos_misc: "corner_pin 11 条（10 dict + 1 null，`corner_pin_info` 四/五角点，未动过写 -1.0；与 `crop` 是两套）；smart_motion 4,858 条带键但 **4,855 为 null**、仅 3 条有值；crop 全带（`{}` 11,589 / 8 角点 4,955）；video_mask_shadow/stroke 见 mask 段与 F-021"
  picture_stroke: >-
    画面侧「描边」= **资源包效果**，不是标量字段（2026-10-18 差分结案 U-39）。
    `materials.video_strokes[]` 条目在类型选「无」时只有 `{id, type:"video_stroke", enable_video_stroke:true,
    resource_id:"", path:""}`——语料里「只有开关落盘」的真相就是类型还停在「无」；
    选「单层描边」后长成 `{…, resource_id, path, resource_name, source_platform:1, color, adjust_params[]}`，
    形状与 `effects[]` 同类。三条换算：`color == [1.0, R, G, B]`（`#12AB34` → `[1.0, 0.0705882, 0.6705882, 0.2039216]`，
    **首位不是 alpha**、顺序是 RGB）；`adjust_params.effects_adjust_size == UI 大小 ÷100`（27→0.27）；
    `effects_adjust_alpha == UI 不透明度 ÷100`（60→0.6）；另有 UI 不暴露的 `min_scale`（默认 320.0）。
    每个 `adjust_params` 项带 `default_value`，恰等于 UI 默认（10→0.1、100→1.0），可直接当校准锚点。
    描边「类型」（无/单层/发光/虚线/手绘）= 选不同 `resource_id`，**不是枚举字段** →
    要复现描边必须解析 `Cache/effect/<resource_id>/<md5>` 资源包。`audio_pannings[]` 的左右平衡值仍未定位。

opacity:
  sources: [clip.alpha, KFTypeGlobalAlpha, KFTypeAlpha]
  blend_before_opacity: 不透明度与混合模式的先后未定（影响合成结果）           # open U-11

blend_mode:
  model: >-
    不是 segment 字段。语料里不存在 blend_mode/mix_mode 键；混合模式以特效资源实现：
    materials.effects[] 中 type == "mix_mode"（去重内容里 166 次，落在 82 份内容；r1 的 332 属翻倍口径）的条目，name 为中文名，
    path 尾段是包 md5，resource_id / effect_id 与安装内索引逐字段相同。
  join_authority: >-
    直连键是 Resources/MixMode/MixMode.json（10 条 {nameId, effectId, resourceId, path=包 md5}），
    r3 全量 join **166/166 命中、0 未匹配** → 不需要再逐包锚定（U-12 结案，F-049）。
    但 **nameId 不能当语义用**：`color_filter` 这条 nameId 指向的包既是 ScreenBlendPreMul、又被草稿写成「滤色」（C-013）。
  available_ops_measured: >-
    协议枚举 12 个模式（multiply overlay screen darken lighten soft_light hard_light color_burn
    color_dodge linear_burn difference color_filter，`…/references/segment-visual.md:205`），
    本机只有 **10 个包** ⇒ **差值(difference) 与 颜色滤镜(color_filter) 无本地资源包**，M2 遇到必须显式降级、不许黑帧。
  package_table: tables/mixmode_packages.csv     # md5 ↔ GLSL 函数 ↔ resourceId/effectId ↔ 草稿中文名与出现数
  draft_witnessed: >-
    6 个包有草稿见证：变亮=Lighten(99 次/56 份)、滤色=Screen(37/22)、线性加深=LinearBurn(17/16)、
    正片叠底=Multiply(6/3)、变暗=Darken(4/2)、叠加=Overlay(3/2)。
    其余 4 包语料零引用，「柔光=SoftLight / 强光=HardLight / 颜色加深=ColorBurn / 颜色减淡=ColorDodge」
    是 GLSL 函数名 + 官方中文名单按位配对推断（配对法本身已被上面 6 项独立验证），**不是草稿见证**。
  mapping_to_css:                       # 名称 → CSS mix-blend-mode（预乘 alpha 语义）
    正片叠底: multiply
    滤色: screen
    叠加: hard-light      # F-077 源码级更正：包内 OverlayPreMul 按背景分支(2.0*bc < ba)，等于 CSS hard-light
    柔光: vendor-sqrt-only   # F-077：包内是经典 sqrt 形式，与 CSS soft-light 的多项式形式差 11/255，CSS 名不可用（要移植包内数学）
    强光: overlay         # F-077：包内 HardLightPreMul 按前景分支(2.0*fc < fa)，等于 CSS overlay
    变暗: darken
    变亮: lighten
    颜色减淡: color-dodge
    颜色加深: color-burn
    线性加深: linear-burn     # 旧注「线性减淡(添加)」是错的；官方中文名 = 线性加深（F-049）
    差值: difference          # 无本地包
    颜色滤镜: color           # 协议叫 color_filter，= 颜色(饱和度/明度互换)；无本地包
    排除: exclusion           # 本机与协议都没有这一模式，保留给 CSS 侧对照
    色相: hue                 # 同上：不在协议 12 项内，属我们的候选补齐面
    饱和度: saturation        # 同上
    亮度: luminosity          # 同上；注意语料里名为「亮度」的 effects 条目 type 是 brightness（调色），不是混合模式
  authoritative_math: >-
    以包内 Library/ShaderData/*/shaderGLES/*.frag 的 GLSL 为准（明文可读）；
    浏览器 CSS 混合本身按预乘 alpha 合成，与 *BlendPreMul 一致，但仍需逐式核对。
    包内 config.json 统一 alphaState=2（10 包全同），但 **它不是 shader 的 `blendAlphaState`**：`blend.material` 属性表只有 inputWidth/inputHeight/_alpha/baseTex/_MainTex（10 包同形），三个 alpha 状态 uniform 由引擎给 ⇒ 走哪条分支包内不可判（F-077 → U-90）；frag 自带注释给的是 `1: pre-multiplied, 2: straight`。**逐式核对已完成（F-077）**：screen/darken/lighten/multiply/linearBurn 五包与 W3C 标准式在 1/255 内等价；`叠加/强光` 与 CSS 同名模式互为反面；`柔光` 须移植包内 sqrt 形式；`颜色减淡/颜色加深` 预乘支有极值点系统差（U-90）。**实现状态（F-079）**：出厂 GLSL 由 `scripts/mixmode_shaders.py` 从包内原文**切片**（不誊写），通道 2 用 `scripts/mixmode_blend.py`（numpy，外部逐格核对过），两侧对包内原文 maxΔ = 0 / 1；浏览器侧尚未接线（U-92）
  keyframable: effects_adjust_* 系列关键帧作用于特效参数               # verified（property_type 频次）

