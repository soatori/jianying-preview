compositing_order:
  root_flag: {render_index_track_mode_on: {true: 1978, false: 63}}       # verified（r3 去重内容）
  track_level: track_render_index 在轨道内恒定（8584 恒定 / 1 变化）      # verified
  segment_level: render_index 按元素类别分带                              # verified
  bands_measured: >-
    旧行只写了「video/audio/adjust 0+、filter 10000+、effect 11000+、text/sticker/mixed 14000+」。
    2026-10-20 全量重跑（51,718 个顶层片段）给出逐类型落带表：
    video `0-999` 7,288 / `1000-9999` 15；audio `0-999` 3,920；adjust `0-999` 290；
    filter `10000-10999` 106；effect `11000-13999` 542 / `0-999` 3；
    text `14000-14999` 19,467 / `15000-15999` 254 / `16000-18999` 29 / `19000+` 207 / `1000-9999` 1；
    sticker `14000-14999` 392 / `15000-15999` 6；
    **mixed 跨四个带** `0-999` 257 / `10000-10999` 1 / `11000-13999` 26 / `14000-14999` 757。
    主带仍是「元素类别」带（0 画面 / 10000 滤镜 / 11000 特效 / 14000 文字贴纸），
    两处更正：mixed 不是 14000+ 专属（它是混合内容轨，天然跨带 → U-62）；
    另有 `15000-15999`/`16000-18999`/`19000+` 三个次带共 496 段，全部落在 text 与 sticker（语义未定 → U-63）。F-048
  array_order: >-
    tracks[] 归一化数组位置均值 video 0.266 → adjust 0.346 → effect/mixed 0.406 → filter 0.432 →
    sticker 0.448 → text 0.468 → audio 0.863；video 先于 audio 5864 对（反向仅 9），
    video 先于 text 4729 对但 text 先于 video 也有 1814 对（27.7%）。
    结论：数组顺序与层级相关但不是绘制权威；绘制次序应由 track_render_index + render_index 决定。
  monotonic_within_track: {monotonic: 2070, not_monotonic: 589}    # 判据：轨道内 ≥2 个带 render_index 的片段；若取 ≥3 则为 1523/510
  direction: 升序是「更靠下」还是「更靠上」未定 —— 必须由 <DRIVE_E>/输出 成片判定     # open U-15
  allocator_rules:                 # 2026-10-21 读出 RenderIndexUtils 全文（F-052，JS 原文，非推断）
    source: app/static/js/ai-creation~15.f6ca3ef2.js 表 tables/render_index_allocators.csv
    non_free_branch:               # 语料实际走这一支
      nextFilterRenderIndex: 'max===0 ? 10000 : max+1'                    # 基座 10000
      nextVideoEffectRenderIndex: 'max===0 ? 11000 : max+1'               # 基座 11000
      nextPluginEffectRenderIndex: 'max===0 ? 15000 : max+1'              # 基座 15000（语料里没有 plugin_effect 轨）
      nextTextAndStickerRenderIndex: 'max===0 ? 14000 : max+2'            # 基座 14000，步长 +2；text 与 sticker 共用同一个分配器
      nextVideoRenderIndex: 'max+1'                                       # 无基座 ⇒ 对应语料 video 0-999
      nextAdjustRenderIndex: 'max+1'                                      # 无基座 ⇒ 对应语料 adjust 0-999
    free_branch: 基座换成 video 2000 / adjust 7000 / videoEffect 11000 / text&sticker 14000，公式是 基座 + count + 2
    free_mode_never_used: >-
      根键 free_render_index_mode_on 在 2,050 份内容里 **缺席 1,402 / false 648 / true 0** ⇒ 桌面草稿从不走 free 分支。
      注意它与 render_index_track_mode_on（true 1,978 / false 63）是**两个不同的根键**，别混用
    layer_is_second_write_point: >-
      贴纸与文字模板落地时同一段 render_index 会再写进 clip 的层级两处
      （t.filter.filterLayer = BigInt(renderIndex) 与 r.layer = BigInt(v)）⇒ 改 render_index 不同步这两处即为静默不一致
    subband_falsification: >-
      次带**不能**由 text&sticker 分配器产生：该分支从偶数基座每次 +2，只会得到偶数并连续填满 14000..19000，
      而语料次带里 text 有 **229 个奇数**、18000 段**一条都没有**、同一份草稿的 19000 段里 29 偶 22 奇并存（F-052，
      tables/render_index_subbands.csv）⇒ 排除「+2 溢出」；15000 基座那个函数只可能解释 15000 段。分配者未找到（U-63）
    monotonic_newer_is_larger: 六个函数一律 max+1 / max+2 ⇒ 新片段索引必然更大（U-15 的方向性旁证之二）
  track_type_wire_values: >-
    厂商 TrackType 的 13 个 wire 值：none video audio sticker text effect filter adjust
    text_to_video_text text_to_video_text_audio composition plugin_effect adcube。
    语料 8 个值里 7 个逐字命中，**唯独 mixed 不在词表内**，且 mixed 只活在 11.1.0~11.4.2 这 5 个版本（825 条），
    11.5.0/11.6.0 为 0 ⇒ mixed 是那一代某功能的落盘名，不是通用「混装容器」；11.6 侧按排除法最可能是 composition，
    但同一性两侧都没证过，**写回不得直接改名**（F-052，tables/track_type_by_app_version.csv）
  z_order_warning: >-
    2026-10-21（F-049）拿到一条**反向**证据，堵掉一条捷径：协议里确有 `z_order`
    （`…/references/segment-visual.md:254`「同层片段的画面层级；数值越大越靠前」，且只有 `<video>` 有、`<image>` 没有），
    但剪映自己的草稿写入层 `runtime/app-server.mjs` 里 `z_order`/`zOrder`/`z_index` **0 命中**，
    而自带工具链的 `layer-planner.mjs:47` 明写 `z_order_is_design_intent_only` 与
    `spatial overlaps require measured occlusion order`（`:173` `native_z_order_emitted:false`）
    ⇒ **官方自己也不靠草稿字段决定叠放**。不许把 XML `z_order` 当 `render_index` 的别名来排层，
    也不许按 `tracks[]` 数组位置直接排。
  group_fields: [group_container, group_id, is_group]                     # 存在但交互未定  # open

