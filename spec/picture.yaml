      `attribute` 不只挂在轨道上：官方 draft 模型层（`ai-creation~11`，F-049）在 **segment** 上声明了同名镜像键
      `track_attribute`、默认 **0**，与 `render_index`/`track_render_index` 并列；r3 实测 51,718 个顶层片段里
      **18,188 个带 `track_attribute`**（`track_render_index` 42,407 个）。读侧两处都要看，写侧要同步，
      谁是权威未判（U-37）
    flag_values_by_type: >-
      video 2/缺席/0 = 1,662/958/575；text 1/缺席/0/3 = 1,004/827/606/2；audio 缺席/0 = 1,722/860（audio 从不用非零值）；
      mixed 2/缺席 = 510/315；effect 缺席/0 = 267/143；sticker 0/缺席 = 140/137；adjust 缺席/0 = 150/44；filter 0/缺席 = 51/17。
      合计 absent 4,393 / 0 2,419 / 2 2,172 / 1 1,004 / 3 2 ⇒ `flag==2` 只出现在 video 与 mixed，`flag==1` 只在 text。
      **U-61 已结案（F-050）**：`flag` 是官方轨道内容类别枚举
      `FlagNone=0 / FlagTextSubtitle=1 / FlagSubVideo=2 / FlagTextLyric=3 / FlagVideoSubtitle=4 /
      FlagAudioSubtitle=5 / FlagAiScriptSubtitle=6`，桌面写入器只用 0/缺席/1/2/3，4/5/6 零出现。
      正面语义：2 = **非首条** video 轨（首条从不为 2），1 = 装 `texts.type=="subtitle"` 的字幕轨（971/1,004 = 96.7%），
      0 与整键缺席等价。完整枚举、位置交叉表与 mixed 的双形态见 `layout.yaml -> main_track.flag_axis`
      与 `tables/track_flag_semantics.csv`
    mixed_two_forms: >-
      mixed 的两种 flag 形态对应两种内容构成，不是同一类（F-050，U-62 已改写）：
      `flag` 缺席的 315 条里 **298 条纯装 `videos.video`（+7 photo）、一条都不装文字** ⇒ 实质是「另一种视频轨」；
      `flag==2` 的 510 条里 227 装 `texts.text`、206 `videos.video`、34 字幕、13 photo、9 `video_effects`、8 `placeholders.adjust`
      ⇒ 才是真混装容器。按 `track.type` 分派渲染时还要再按 `flag` 分一次，且 mixed 从不写 `name`（F-048），面板上两类都没有轨道名
  segment_shapes:                     # 片段键集不是由轨道类型决定（F-048，此前规格没有这一节）
    distinct_keysets: {video: 524, mixed: 104, text: 32, audio: 31, adjust: 26, sticker: 20, effect: 13, filter: 10}
    canonical_full_45: >-
      全语料有且只有一种 45 键的「完整形」（无第二种变体），共 **6,004 个片段**带它（audio 2,244 / text 2,237 / video 1,233 /
      effect 109 / adjust 78 / sticker 58 / filter 45）：比常见形多出
      `caption_info, color_correct_alg_result, desc, digital_human_template_group_id, is_loop, lyric_keyframes,
      raw_segment_id, state` 与一组 `enable_*` 开关
    canonical_full_34: 另一种 34 键形（缺上面那批音频/歌词族与占位键）出现在 video/effect/sticker/filter 的主干上
    minimal_by_type: >-
      每类的高频最小形：audio 13 键（43.1%，5,489）、text 15 键（34.7%，6,940）、mixed 15 键（30.5%，729）、
      effect 12 键（46.6%，254）、adjust 8 键（18.4%，87）、sticker 14 键（13.6%，54，但 sticker 最常见的其实是 34 键形 25.4%）、
      video 13 键（9.9%，1,486）但 video 的形状极度分散（524 种）；**filter 反过来——它的多数形就是 45 键完整形（40.5%，45/111）**
    rule: >-
      解析器不能按「轨道类型 → 固定字段表」写分支：同一类型里最小形与完整形并存。
      可读的判据是「键是否存在 + field_states 四态」，缺失即按默认处理；写回时**不得**因为片段是 audio 就补出 video 侧的键

known_limits:                     # 已定位、量级已知、**决定不修**的偏差（与 text.yaml: fonts.known_ceiling 同族）
  browser_decode_luma_bias:
    measured: "浏览器比两条离线腿亮 +1.09 码值（t=7.0，solo 模型，中心框 23.7%）；同一条代理帧**不经 Pixi** 回读就 +0.86；已知 RGBA 纹理过 Pixi 上屏回读 Δ 全 0"
    cause: "浏览器 NV12→RGB 与 ffmpeg 在 limited range / 取整上的实现差（代理帧自带 colorSpace={bt709,bt709,bt709,fullRange:false}，coded 1088×1920 vs display 1080×1920）"
    magnitude: "0.86–1.09 码值 = 满量程 0.34%；素材自身帧间起伏就有 ±0.4 码值"
    decided: "不修。要修只能在 VideoFrame→bitmap 处自做转换（每帧全幅代价），换 0.3% 码值；且会引入「与 ffmpeg 谁对」的新判据问题"
    do_not: "不要去动 Pixi 的 colorSpace——F-091 已证明上屏通道逐码值中性"
    evidence: "F-090 / F-091 / F-092；仪器 colour_range_probe.py、pixi-colour-readback.html、webcodecs-rgb-readback.html"
  geometry_warning:
    rule: "任何跨腿的码值/亮度比较，必须先核验三腿的**宽高比与中心框比例一致**（浏览器截图是 stage 内容包围盒，540 宽常配 540×953，不是 540×960）"
    why: "本项目已两次把几何失配读成色彩差：F-083 的猜带、P-39 的 256 像素固定中心框（假 +21 码值）"
