# 动画预设清单（按语料频次排序，决定 phase-1 实现优先级）
# 数据来源：2050 份去重内容聚合（快照 2026-10-16，r3；r1 按文件计且被翻倍、r2 是首次去重口径），
# temp/corpus-scan/csv/animations.csv + temp/corpus-detail/animation_timing.csv；表见 ../evidence/tables/animations_top60.csv
# 已验证：预设曲线在预设包内为明文 Lua + GLSL，可读，不需从成片反推（findings F-012）

reference_shape:
  bucket: materials.material_animations[]
  item_fields: [id, type, name, resource_id, path, category_name, extra_material_refs(可选)]
  container_type: >-
    `material_animations[].type` **恒为 `sticker_animation`**（34,821 / 34,821，r3），
    视频动画与字幕动画也一样叫这个名字。绝不要按容器 type 筛元素类别 —— 用
    `animations[].material_type`（`sticker` / `video` / `""` / 缺席）和 `animations[].panel`。
  animation_entry: >-
    animations[]{id, type, resource_id, path, material_type, duration, name, category_name, category_id,
    source_platform, third_resource_id, request_id, panel, start, platform, anim_adjust_params}
    （r3 出现次数：id/type/resource_id 10,563、path 10,553、material_type 10,514、duration 10,354、
    name 9,393、category_name 8,877、category_id 8,846、source_platform 8,707、third_resource_id 8,253、
    request_id 5,004、panel 4,006、start 3,577、platform 3,529、anim_adjust_params 3,523）
  types: [in, out, loop, caption, group]        # r3 实测 5 类；r1/r2 规格只记了前三类
  types_count: {in: 8388, loop: 1587, out: 303, caption: 158, group: 129}
  type_reading: >-
    `caption` = 文本面板的「字幕动画」子 tab（向下弹出 / 放大弹动 / 文字裂开 / 渐显II，
    `category_name` 常为 字幕动画）；`group` = 视频动画面板的「组合」类（缩放 / 荡秋千 / 波动放大 / 分身，
    `panel` 恒为 `video`）。此前把「组合」解释成 loop 与 in+out 并存、把「字幕」解释成
    lyrics_template + ktv_color，两条都不成立（见 ../evidence/findings.md F-020 批次、panel-map 对应行）。
  categories_observed: >-
    `category_name` 混了五种写法：中文名（收藏 3,626 / 入场 1,978 / 循环 246 / 出场 145 / 组合 26 /
    字幕动画 52）、空串 2,411、拼音（ruchang 128 / chuchang 3 / xunhuan 2）、英文（in 126 / group 88 /
    out 41 / loop 3）、繁体（進場 4）。命名与匹配都不能假设单一语言，`""` 与缺席要当「未分类」。
  adjust_params_status: anim_adjust_params 存在 3,523 条，**全部是空数组** —— 语料里没有预设参数的用户覆盖值。
  name_is_not_identity: >-
    **同名不是同一预设**：`animations[].name` 只是显示文案，唯一身份是 `resource_id`（配合 `path` 尾段 md5）。
    r3 里 `渐显` 这一个名字对应三个不同 id（69 / 66 / 51 条），包内实现并不相同；一条 2026-10-28 的成片
    同时用了两族 —— 字幕族 `6724916044072227332`（包内 `Appear.lua`）、视频族 `6798320778182922760`
    （包内 `Transform.lua` + `filter.material` + `xshader`），`material_type` / `panel` 也不同。
    ⇒ 读侧 match 必须落在 `resource_id`；写侧不得把「名字对得上」当能力证明；
    按名近似仍是常规路径（U-21 覆盖率 36.6%），但必须标注「近似」（见 `approx_by_name`）。
  implementation_tiers: >-
    本机实测的三档成本（`docs/evidence/unresolved.md` U-91）：已实现的三个预设恰好都是
    「4 文件 + 1 lua + 无 shader」的纯 `fromTo` 预设（向下滑动/缩小/渐显）；其余 9 个要么带自定义
    shader（T1/T2）、要么走 AE 导出脚本（T3，需要脚本语义而不只是数学）。
    判据同一条：区域 MAD 的「开动画更近 / 更远」计数（F-080/P-33），T3 还需先与包内脚本逐帧对数。
  curve_source: >-
    **曲线值不在草稿字段里，在预设包内的明文 lua 里**（F-078）。形如
    `tween:fromTo(target, {["localPosition"]=Amaz.Vector3f(0.0, 2.66 * textureH / screenH, 0.0)}, {…},
    0.1, Amaz.Ease.quadOut, …)`，位置在 `Cache/effect/<resource_id>/<md5>`（本机 33/33 全在）。
    读取与求值实现见 `scripts/animation_curve.py`；`Amaz.Ease.quadOut` 的函数式是**假设**（引擎 Ease 表
    不在包内），由成片判。覆盖度要写清楚：`<草稿A>` 的 14 个预设里只有 3 个
    （向下滑动/缩小/渐显）用 `fromTo` 声明，其余走 AE 导出脚本或 `onUpdate` 显式数学。

timing:                                         # 渲染必需，此前规格完全没记
  unit: 微秒；`duration` 是预设时长，`start` 是该动画在片段内的起始偏移
  duration_is_not_the_curve: >-
    **`duration` 不等于曲线跑完的时间**：本时间线 `duration` 是 0.5 s 的预设槽长，而包内 lua 的
    tween 参数是 **0.1 s**（= 3 帧 @30fps）。按 `duration` 取测量窗会把 3 帧的真实差摊到 15 帧上，
    整帧相关的中位数因此几乎不动（P-30 第一版犯的错，就地更正）。判可见差要用 tween 时长。
  source: temp/corpus-detail/animation_timing.csv（r3，按类型聚合，可重跑）
  duration_ranges:
    in: {min_us: 33333, max_us: 4200000, distinct: 135}
    loop: {min_us: 0, max_us: 5000000, distinct: 64}
    out: {min_us: 0, max_us: 3100000, distinct: 32}
    group: {min_us: 100000, max_us: 4700000, distinct: 55}
    caption: {min_us: 533333, max_us: 3000000, distinct: 51}
  start_rule: >-
    **非零 `start` 只出现在 out（108 条）与 group（10 条）上**；in / loop / caption 的 `start`
    要么缺席要么为 0（`start_nonzero=0`）。缺 `duration` 键的条目也存在（r2 口径：in 51 条、out 56 条、
    loop 47 条、caption 55 条，`temp/check-1016/probe.txt`），此时才需要回落到预设包
    `extra.json.setting.animation_duration`（单位秒）。
  live_sample: >-
    10月16日 草稿的视频片段同时挂了三个动画：入场「渐显」duration 500000、出场「渐隐」start 600000
    duration 500000、组合「形变缩小」start 500000 duration 100000 —— 一次实测三种时序形态。
    单样本，仅供理解字段，不作为分布依据。

frequency_note:                            # verified，且是重要提醒
  nameless_in: 1418                        # name 为空串
  nameless_loop: 867
  nameless_out: 25
  name_literal_null: {caption: 56, out: 53, loop: 2, in: 1}   # name 真的是 JSON null
  total_animation_entries: 10563
  meaning: >-
    大量动画条目没有 name（或 name 为 null）。这类多半是默认淡入淡出/循环，而非具名预设。
    渲染器不得假设 name 一定存在，也不得把「无 name」当错误。
  r1_caveat: >-
    r1 把「空串 name」与「null name」记成两套数（nameless_in 2836 与 missing_name_value_None {in:1228}），
    既有翻倍问题又混淆了两种取值，故本表整体重测；具名预设的相对次序也变了（弹簧现在高于「弹入」）。

