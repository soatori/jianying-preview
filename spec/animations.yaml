distinct_presets_total: 417                # 键 =(type,name,id)；把 category_name 也计入则是 606（r3；r2 是 416/605，见 F-019/F-020）

preset_package_layout:                     # verified（实测一个入场包）
  files:
    - config.json
    - content.json
    - extra.json
    - anim.prefab
    - "<ClassName>.lua"
    - Sprite2D.xshader
    - Sprite2D.material
    - "gles2_*.vert"
    - "gles2_*.frag"
    - "*.png"
    - "*.png.meta"
  config_json: '{"effect": {"Link":[{"type":"InfoSticker"}]},"version":"6.6.0"}'
  content_json: '{"filemap": {"prefab":"anim.prefab"}}'
  extra_json: '{"setting": {"animation_duration":2.0}}'      # 单位：秒
  prefab: >-
    YAML（%YAML 1.1 / !Prefab）：entities[].components[] 里 __class: ScriptComponent，
    path 指向 Lua 脚本（如 TextAnim.lua），className 指明入口（TextAnim），
    properties.spriteMaterial 指向 .material。
  lua_header_protocol: >-
    脚本首行用注释声明可调参数：`--@input float duration = 1.5{"widget":"slider","min":0.1,"max":6.0}`，
    随后是常量（如 spriteScaleConst=0.7、spriteRotateSpeed=-250、charScale=0.6、charOffset=-0.6）。
    参数区间直接写在声明的 JSON 里，可用于 UI 与自动复现。
  shader: gles2_*.frag 明文，例如打字光标用 `c*curalpha` 与边缘 smoothstep 羽化

resolution_chain:
  - "先展开路径宏：`path` 可能是 `##_draftpath_placeholder_<uuid>_##/…`（全语料 1,311 / 2,050 份内容在用，共 58,108 次），它指向**草稿自己的目录**，既不是绝对路径也不是安装目录（F-024）。不展开就会「包不存在」。"
  - 用 animations[].path 直接定位包目录（若存在）
  - 否则用 resource_id 在 Cache/effect/<resource_id>/<md5>/ 下查找
  - 缺 md5 时可用第三方目录表补：`(resource_id, md5)` 就是包目录名，实测有效（../evidence/cross-reference.md 第 3 节）
  - 路径可能指向历史安装位置（实测见 <DRIVE_D>/设计软件\JianyingPro\9.4.0.13603\... 之类的旧路径）→ 必须按 basename/resource_id 重查
  - 包不存在时按 name 关键词近似（渐显/渐隐/弹入/缩放/打字/翻转/抖动…），并在渲染层标注「近似」
  - 本机缓存只覆盖 36.6% 的可定位预设（U-21）→「按名近似」是常规路径而非异常路径

approx_by_name:                            # 无包时的兜底映射（phase-1 只保证语义方向正确，不保证曲线一致）
  渐显: opacity 0→1
  渐隐: opacity 1→0
  弹入: scale 0.5→1 + 弹性缓动
  缩小: scale >1→1
  放大: scale <1→1
  打字机: 按 characters 逐字可见（与 words[] 联动，未定）
  向上弹入: transform.y 由下向上归位 + 弹动
  抖动: transform 小幅随机位移（loop）

t2a_laws:                                 # verified（F-086，2026-10-24）：包内三个文件逐行读到，非推测
  # 分层口径见 `evidence/tables/animation_tiers.csv`（脚本 scripts/animation_tiers.py）：
  # T0 曲线可求值 3 预设/8 段；**T1 0 段**（放宽 fromTo 读取器这条路已空）；
  # T2a 2 预设/15 段（frag 单采样、无循环 ⇒ **不需要执行 GLSL**）；T2b 1/2；T3 6/8。
  向上露出:
    package: Cache/effect/7163514358935327268/3786ff3f…   # TextAnim.lua + rt.vert + rt.frag
    kind: in
    duration_ms: 500
    animated_uniform: eraseUV        # vec2，**唯一的动画量**
    law: |
      TextAnim:seek(time):
        height_cut = rectH / texH1                     # 静态：文字 rect 高 ÷ 扩展 rect 高
        eraseUV    = (0,1) * (1 - ease(time/duration)) # 1 → 0
        ease = 闭式三次贝塞尔 controls {0,0,0.5,1}：
               getBezierTfromX 用二分反解 x→t（until te-ts < 0.0001），再取 value[2] 插值
      rt.vert:  uv0.y = (1.0 - uv0.y) + eraseUV.y      # ⇒ **动画在顶点阶段**：贴图垂直滚动 + y 翻转
                uv0.x = uv0.x + eraseUV.x
      rt.frag:  texture2D(_MainTex, uv0)
                * step(uv0.y, 1.)
                * step(uv.y, 1. - (1.-height_cut)*0.5*0.8)   # 裁剪用**未滚动**的 uv ⇒ 窗口固定
    semantics: 文字在一个不动的窗口里向上滑出（遮罩 + 平移），不是透明度、不是缩放
    needs_glsl: false
    implement:
      offline_channel: 把文字画进「扩展框」后按 eraseUV.y·texH 做 y 偏移采样，
                       再按 thr = 1-(1-height_cut)*0.4 裁行（PIL 侧等价于 crop + paste）
      browser_channel: Container + 固定 Graphics mask + 文字 y 偏移（不需要 Filter）
      renderToRT: 引擎实现细节（time ≤ duration 时把文字画进 RT），**效果层不需要跟着做**
    caution: |
      分层只看 frag 的采样次数会「结论对、理由错」：本例 frag 只是固定裁剪，动画量在 .vert。
      已给 animation_tiers.py 加 `vert_scroll`（uniform 是否进顶点着色器的 uv 赋值）；
      实测 向上露出 / 侧滑 / 向上闪入 = 1。
  打字光标:
    package: Cache/effect/…/12196518b89652860631d196d19b6f45   # TextAnim.lua 14098B + kiss.png(+meta)
    #   + gles2_yvsong.frag / gles2_bvcwvg.vert + Sprite2D.material/.xshader（**那是光标的 shader，不是文字的**）
    #   + anim.prefab / config.json / content.json / extra.json / effect_platform_children.tag
    kind: in
    segments: 14                       # 全时间线 33 段里的 42%，是最大的单块欠口
    structure_verified: |
      函数表（实测全文）：constructor / reset / CheckChinese / isDigital / isAlphabet /
      getCharPt(char_index,time) / checkDirty(time) / onStart / refreshrandomTime /
      onUpdate(comp,deltaTime) / getavePosy / getavePosX / getaveWidth / getcuralpha /
      seek(time) / setDuration / resetData / clear / onEnter / onLeave。
      表字段：FirstCharOfRow、action_time、random_tween_time(+1)、sprites、tweens、imageSize、editor。
      材质写入只有三处：`setFloat('alpha',1.0)`、`setFloat('curalpha',1.0)`、
      `setFloat('curalpha', self.curpt or 1.0)`，外加 `setTextWrapper(text)`。
    semantics: |
      **不是 shader 阻塞**（F-085 的 frag 语义判据也把它列在 T2a）：`curalpha` 是文字材质上的
      **一个逐字阈值**——等价于「前 N 个字可见，第 N+1 个字按小数部分渐显」。
      所以两通道都能**不跑 GLSL** 实现：通道 2 = 按可见前缀子串绘制 + 边界字按小数 alpha；
      浏览器 = 同一套（子串或按字边界放 mask），不需要 Filter。
      光标是**另一个 sprite**（kiss.png + 自带 frag/vert，−250°/s 旋转），属于叠加层，不是文字通道。
    hard_parts:                        # 这些才是真成本，逐条列清楚免得下一轮重新发现
      - refreshrandomTime ⇒ 逐字出现时刻带**随机表**（random_tween_time / +1），
        没找到种子 ⇒ **逐帧精确匹配成片可能不可达**，只能匹配「整体节奏 + 单调性」
      - CheckChinese / isDigital / isAlphabet + getaveWidth/getavePosX/getavePosy
        ⇒ 光标位置按**字符类别宽度启发式**算，需要与我们的字体度量对齐
      - FirstCharOfRow ⇒ 换行处首字特殊处理（行边界判定）
      - checkDirty(time) + seek(time) ⇒ 有**状态**，不是纯函数：跳播/回头要可重入
    status: 未实现；**按独立特性排产**（自带验证），不是「补一条曲线」的量级
    verified: structure-only

verification:
  method: 用 <DRIVE_E>/输出 成片逐帧比对位移/缩放/透明度曲线（M2）
  note: 曲线本身可从 Lua 读出，成片用于确认我们对该 Lua 的理解是否正确
